<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Patrol</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Silkscreen:wght@400;700&display=swap">
<style>
:root{color-scheme:dark;--shell:#17151f;--line:#443644;--ink:#f7e1c9;--muted:#b6a4ac;--amber:#fbb37e;--mono:"IBM Plex Mono",monospace;--display:"Silkscreen",monospace}
*{box-sizing:border-box}
body{margin:0;background:#100f17;color:var(--ink);font:12px var(--mono);min-height:100svh;display:grid;place-items:center}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.machine{width:min(100%,1720px);height:100svh;max-height:1050px;min-height:330px;display:grid;grid-template-rows:68px minmax(0,1fr) 54px;padding:0 30px;background:var(--shell)}
header,footer{display:flex;align-items:center;justify-content:space-between;gap:16px;min-width:0}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);font:700 25px/1 var(--display);letter-spacing:-.09em}
.insignia{width:29px;height:24px;background:var(--amber);clip-path:polygon(0 29%,32% 29%,50% 0,68% 29%,100% 29%,100% 44%,74% 44%,50% 94%,26% 44%,0 44%,0 29%,36% 44%,50% 71%,64% 44%,50% 21%,36% 44%);display:block}
nav{display:flex;align-items:center;gap:3px}
nav button,.audio{border:1px solid transparent;background:transparent;padding:8px 11px;color:var(--muted);letter-spacing:.035em;white-space:nowrap}
nav button[aria-pressed="true"]{border-color:#69505a;color:var(--amber);background:#2b212d}
nav button:hover,.audio:hover{color:var(--ink);border-color:var(--line)}
.deck{position:relative;isolation:isolate;overflow:hidden;border:1px solid #765764;background:#3c3049;touch-action:none}
.deck::after{content:"";position:absolute;pointer-events:none;inset:0;border:1px solid #f6af8436;z-index:4}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
#instruments{z-index:1}
.intro{position:absolute;z-index:2;left:clamp(22px,5.5vw,90px);bottom:clamp(30px,9.8vh,100px);display:grid;justify-items:start;color:#fff0d3;text-shadow:3px 3px #30263e,0 2px 18px #30263e;transition:opacity .22s}
.intro[hidden],.loading[hidden]{display:none}
.intro h1{font:700 clamp(57px,10vw,146px)/.81 var(--display);letter-spacing:-.115em;margin:0 0 20px -.105em}
.intro p{margin:0 0 24px;font-size:clamp(10px,1.25vw,15px);font-weight:600;letter-spacing:.24em}
.launch{color:#211b2b;background:#ffd3a5;border:0;padding:11px 15px;font-weight:600;box-shadow:3px 3px #6c495d;letter-spacing:.1em}
.launch:hover{background:#ffe5bf}
.loading{z-index:3;position:absolute;inset:0;display:grid;place-content:center;justify-items:center;background:#282132;color:var(--ink);gap:18px}
.loading b{font:700 clamp(40px,9vw,95px)/1 var(--display)}
.loading progress{appearance:none;width:min(230px,65vw);height:7px;border:1px solid #a47980;background:#4a3749;color:#f6af80}
progress::-webkit-progress-bar{background:#4a3749}progress::-webkit-progress-value{background:#f6af80}progress::-moz-progress-bar{background:#f6af80}
.hints,.stores{display:flex;align-items:center;gap:15px;white-space:nowrap;color:var(--muted)}
.hints span{display:flex;align-items:center;gap:5px}
kbd{font:500 11px var(--mono);color:var(--ink);background:#29232f;border:1px solid var(--line);padding:1px 5px}
.stores{gap:8px;color:var(--ink)}
.store-label{font-size:10px;letter-spacing:.11em;color:var(--muted)}
.pips{display:flex;gap:4px}
.pips i{display:block;width:6px;height:14px;clip-path:polygon(50% 0,75% 25%,75% 75%,100% 86%,100% 100%,0 100%,0 86%,25% 75%,25% 25%);background:#524150}
.pips i.ready{background:var(--amber)}
.audio{display:inline-flex;gap:6px;align-items:center;margin-right:-8px}
.audio svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.3}
.touch{display:none;gap:6px}
.touch button{background:#211a2bdd;color:#ffe0ba;border:1px solid #a57b7f;padding:9px;min-width:47px;min-height:38px;touch-action:none}
.touch button:active{background:#7a4c55}
@media(pointer:coarse){.touch{display:flex}.hints{display:none}}
@media(max-width:790px){.machine{padding:0 12px;grid-template-rows:56px minmax(0,1fr) 44px}.hints{gap:8px;font-size:10px}.hints span:last-child{display:none}.store-label{display:none}}
@media(max-width:540px){.machine{padding:0 8px}.brand{font-size:20px;gap:5px}.insignia{width:18px;height:18px}nav button,.audio{padding:6px;font-size:10px}header,footer{gap:6px}.hints{gap:7px;font-size:0}.hints kbd{font-size:10px}.hints span:last-child{display:flex}.intro h1{margin-bottom:14px}.intro p{margin-bottom:15px}}

<script id="generator" type="text/worker">
const SIZE = 512, TILE = 4096, CELL = TILE / SIZE;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mix = (a, b, t) => a + (b - a) * t;
const fract = v => v - Math.floor(v);
function hash(x, z) {
  let n = Math.imul(x + 123, 374761393) + Math.imul(z + 67, 668265263);
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
function noise(x, z, period) {
  x *= period; z *= period;
  const i = Math.floor(x), j = Math.floor(z), wrap = n => (n % period + period) % period;
  const u = fract(x), v = fract(z);
  return mix(mix(hash(wrap(i), wrap(j)), hash(wrap(i+1), wrap(j)), u*u*(3-2*u)),
             mix(hash(wrap(i), wrap(j+1)), hash(wrap(i+1), wrap(j+1)), u*u*(3-2*u)), v*v*(3-2*v));
}
const lakes = [[.31,.51,.183,.105,-.56],[.51,.29,.105,.14,.75],[.74,.60,.16,.10,-.72],[.11,.13,.105,.070,.51],[.70,.87,.145,.073,.63],[.89,.27,.09,.08,.26],[.34,.82,.068,.085,.82]];
const basins = lakes.map(([x,z,a,b,r]) => [x,z,a,b,Math.cos(r),Math.sin(r)]);
function landscape(x,z) {
  const a = noise(x,z,5);
  const b = noise(x+.19,z+.33,11);
  const c = noise(x,z,25);
  const d = noise(x+.43,z+.12,55);
  const e = noise(x,z,113);
  const r = 1 - Math.abs(2*noise(x+.27,z+.07,8)-1);
  const crest = Math.pow(Math.max(0, .47*a+.29*r+.24*b-.27),2.15)*1490;
  const upland = 17 + 40*b + 28*c + (d-.5)*27 + (e-.5)*13 + crest;
  const wx = x+(b-.5)*.076+(d-.5)*.017;
  const wz = z+(noise(x+.4,z,10)-.5)*.074+(c-.5)*.028;
  let shore = 3;
  for (const [cx,cz,rx,rz,cs,sn] of basins) {
    const dx = fract(wx-cx+.5)-.5, dz = fract(wz-cz+.5)-.5;
    shore = Math.min(shore, Math.hypot((cs*dx-sn*dz)/rx,(sn*dx+cs*dz)/rz));
  }
  const pool = (shore - 1.02)*170 + (c-.5)*11;
  const rim = clamp((shore-1.04)*1.58,0,1);
  const h = mix(pool, upland, rim);
  const trees = .36*noise(x+.33,z+.53,19) + .31*noise(x,z,38) + .20*d + .13*e;
  const autumn = .55*noise(x,z,29)+.30*noise(x+.23,z+.24,67)+.15*e;
  return [h,trees,autumn];
}
onmessage = ({data}) => {
  const {start,end,field} = data;
  const rows = new Uint8Array((end-start)*SIZE*4);
  const height = (x,z) => field[((z & 511)*SIZE+(x & 511))*4]*(680/255)-115;
  for (let z=start;z<end;z++) {
    for (let x=0;x<SIZE;x++) {
      const i = ((z-start)*SIZE+x)*4;
      if (!field) {
        const [h,tree,autumn] = landscape((x+.5)/SIZE,(z+.5)/SIZE);
        rows[i] = clamp(Math.round((h+115)*255/680),0,255);
        rows[i+1] = Math.round(tree*255);
        rows[i+2] = Math.round(autumn*255);
      } else {
        const h = height(x,z);
        const dx = (height(x+1,z)-height(x-1,z))/(2*CELL);
        const dz = (height(x,z+1)-height(x,z-1))/(2*CELL);
        let shade = clamp(.60+(.629*dx+.744*dz)*.31,.25,.92);
        for (const k of [2,4,7,11,17,25,36,50,67,90]) {
          const rise = height(x-Math.round(.629*k),z-Math.round(.744*k))-h;
          if (rise>k*CELL*.29+4) { shade *= .54; break; }
        }
        const index = (z*SIZE+x)*4;
        rows.set(field.subarray(index,index+3),i);
        rows[i+3] = Math.round(shade*255);
      }
    }
    if ((z-start)%8===7) postMessage({progress:(z-start+1)/(end-start)});
  }
  postMessage({rows},[rows.buffer]);
};
</script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const deck = $(".deck"), world = $("#world"), panel = $("#instruments");
const ctx = panel.getContext("2d");
const gl = world.getContext("webgl2", {antialias:false, alpha:false, depth:true, powerPreference:"high-performance"});
const TAU = Math.PI*2, TILE = 4096, SIZE = 512, HOLD = .22;
const clamp = (x,a,b) => Math.max(a,Math.min(b,x));
const mix = (a,b,t) => a+(b-a)*t;
const wrap = (x,p) => ((x%p)+p)%p;
const angle = a => wrap(a+Math.PI,TAU)-Math.PI;
const smooth = (a,b,x) => { const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const add = (a,b) => [a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const sub = (a,b) => [a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const mul = (a,s) => [a[0]*s,a[1]*s,a[2]*s];
const dot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross = (a,b) => [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const unit = a => mul(a,1/(Math.hypot(...a)||1));
const INITIAL = [968,143,2380], START_YAW = -.51;
const state = {p:[...INITIAL], velocity:null, yaw:START_YAW, north:0, pitch:0, bank:0, bankBase:0, speed:99, vs:0, g:1, slip:0, turnRate:0, heat:0, engines:[.70,.70], roll:0, rollTime:0, rollCamera:false,
  view:0, weights:[1,0,0], transition:null, started:false, pilot:false, time:0, warning:false, fired:0, strikes:0};
const input = {x:0,y:0,left:false,boost:false,pressed:0,touch:null};
const racks = [[-6.25,-1.5],[6.25,-1.5],[-4.25,.05],[4.25,.05]].map(([x,z])=>({x,z,ready:0}));
const missiles = [], motes = [], impacts = [], trails = [[],[]];
let field, W=1,H=1, quality=340, projection, camera, frame=0, last=0, fps=0, slow=0, fast=0;
let nextWake=0, raf, glState, lastCount=-1;

async function terrain() {
  const url = URL.createObjectURL(new Blob([$("#generator").textContent],{type:"text/javascript"}));
  const count = Math.min(4, Math.max(2,navigator.hardwareConcurrency || 2));
  const workers = Array.from({length:count},() => new Worker(url));
  const progress = $("progress");
  const run = (source,stage) => {
    const result = new Uint8Array(SIZE*SIZE*4), finished = Array(count).fill(0);
    return Promise.all(workers.map((worker, i) => new Promise((resolve,reject) => {
      const start = Math.floor(i*SIZE/count), end = Math.floor((i+1)*SIZE/count);
      worker.onmessage = ({data}) => {
        if (data.rows) { result.set(data.rows,start*SIZE*4); finished[i]=1; resolve(); }
        else finished[i] = data.progress;
        progress.value = stage + finished.reduce((a,b)=>a+b,0)*.5/count;
      };
      worker.onerror = reject;
      worker.postMessage({start,end,field:source});
    }))).then(() => result);
  };
  try { return await run(await run(null,0),.5); }
  finally { workers.forEach(w=>w.terminate()); URL.revokeObjectURL(url); }
}
function terrainAt(x,z) {
  const a=x*SIZE/TILE-.5, b=z*SIZE/TILE-.5, ix=Math.floor(a),iz=Math.floor(b);
  const i0=(iz&511)*SIZE, i1=((iz+1)&511)*SIZE, j0=ix&511,j1=(ix+1)&511;
  const lo=mix(field[(i0+j0)*4],field[(i0+j1)*4],a-ix);
  const hi=mix(field[(i1+j0)*4],field[(i1+j1)*4],a-ix);
  return mix(lo,hi,b-iz)*(680/255)-115;
}
const surface = (x,z) => Math.max(0,terrainAt(x,z));
const vertexScreen = `#version 300 es
void main(){
  vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);
  gl_Position=vec4(p*2.0-1.0,0.0,1.0);
}`;
const cameraGL = `
uniform vec3 eye, right, up, forward;
uniform vec2 resolution;
uniform float focal;
const float farPlane=13000.0, nearPlane=.65;
float depthAt(float z){return farPlane/(farPlane-nearPlane)-(farPlane*nearPlane/(farPlane-nearPlane))/z;}
vec4 project(vec3 pt){
  vec3 p=pt-eye;
  float z=dot(p,forward);
  vec2 xy=vec2(dot(p,right),dot(p,up))*focal*2.0/resolution;
  return vec4(xy,(2.0*farPlane/(farPlane-nearPlane)-1.0)*z-2.0*farPlane*nearPlane/(farPlane-nearPlane),z);
}
`;
const commonGL = `
const vec3 sunDir=vec3(-.629,.245,-.744);
float bayer(vec2 p){
  ivec2 i=ivec2(p)&3;
  const float b[16]=float[16](0.,8.,2.,10.,12.,4.,14.,6.,3.,11.,1.,9.,15.,7.,13.,5.);
  return (b[i.x+i.y*4]+.5)/16.;
}
float stepped(float x,float n,float t){float y=clamp(x,0.,1.)*n;return (floor(y)+step(t,fract(y)))/n;}
float hash(vec2 p){
  vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);
}
float noise(vec2 p){
  vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+1.),f.x),f.y);
}
`;
const worldFrag = `#version 300 es
precision highp float;
${cameraGL}
${commonGL}
uniform sampler2D map;
uniform float time;
uniform vec3 jet;
uniform vec2 nose;
uniform vec4 scars[4];
out vec4 color;
const vec3 peach=vec3(1.,.66,.49);
const vec3 violet=vec3(.59,.47,.65);
float height(vec2 p){return texture(map,p/4096.).r*680.-115.;}
vec3 atmosphere(vec3 d,float t){
  float toward=pow(max(0.,dot(normalize(vec2(d.x,d.z)+vec2(.0001)),normalize(sunDir.xz))),5.);
  return mix(vec3(.59,.48,.65),vec3(1.,.71,.50),stepped(toward,5.,t));
}
vec3 sky(vec3 d,float t,bool detail){
  vec3 edge=atmosphere(d,t);
  float elev=max(d.y,0.), shine=max(dot(d,normalize(sunDir)),0.);
  vec3 zenith=vec3(.164,.156,.29);
  vec3 col=mix(edge,zenith,stepped(pow(clamp(elev*1.75,0.,1.),.62),13.,t));
  col=mix(col,vec3(.99,.59,.38),stepped(pow(shine,11.)*.37,8.,t));
  if(detail && d.y>.012){
    vec2 p=vec2(d.x*3.7+d.z*2.2,d.y*49.+d.x*4.1-d.z*1.7);
    float streak=noise(p)*.72+noise(p*vec2(2.7,1.3)+.82)*.28;
    float fragment=smoothstep(.64,.86,streak)*smoothstep(.03,.12,d.y)*(1.-smoothstep(.26,.60,d.y));
    col=mix(col,peach,stepped(fragment*.44,8.,t));
  }
  if(shine>.99635) col=shine>.9978?vec3(1.,.931,.729):vec3(1.,.805,.567);
  return col;
}
float cloudMask(vec2 p){
  p=(p+vec2(time*3.4,time*.76))/565.;
  vec2 cell=floor(p);
  float id=hash(cell+15.7);
  vec2 center=.43+.14*vec2(hash(cell+6.3),hash(cell+1.6));
  vec2 q=(fract(p)-center)*vec2(1.,1.18);
  float lobe=.18*noise(p*7.1)+.09*noise(p*18.4);
  return .84-.34*id-dot(q,q)*2.38+lobe-.13;
}
float cloudBody(vec3 p){
  float altitude=(p.y-347.)/82.;
  return cloudMask(p.xz)-.554-altitude*altitude*.285;
}
float jetShadow(vec2 p,float y){
  vec2 q=p-jet.xz+sunDir.xz*(jet.y-y)/sunDir.y;
  vec2 f=nose;
  vec2 r=vec2(-f.y,f.x);
  float a=dot(q,f),b=abs(dot(q,r));

}
vec4 clouds(vec3 d,float limit,float t){
  if(abs(d.y)<.005) return vec4(0);
  float a=(263.-eye.y)/d.y,b=(431.-eye.y)/d.y;
  float start=max(2.,min(a,b)),end=min(min(limit,max(a,b)),9500.);
  if(end<=start) return vec4(0);
  float ray=start, previous=start;
  for(int i=0;i<28;i++){
    vec3 p=eye+d*ray;
    float density=cloudBody(p);
    if(density>.002){
      float lo=previous,hiRay=ray;
      for(int j=0;j<3;j++){
        float mid=(lo+hiRay)*.5;
        if(cloudBody(eye+d*mid)>.002)hiRay=mid; else lo=mid;
      }
      ray=hiRay;p=eye+d*ray;density=cloudBody(p);
      float hi=cloudBody(p+sunDir*59.);
      float lighting=clamp(.56+(p.y-327.)*.0031+(density-hi)*4.6,0.,1.);
      vec3 c=mix(vec3(.465,.345,.55),vec3(1.,.752,.591),stepped(lighting,6.,t));
      if(lighting>.76) c=mix(c,vec3(1.,.889,.72),stepped((lighting-.76)*3.4,4.,t));

      return vec4(mix(c,atmosphere(d,t),haze),ray);
    }
    previous=ray;
    ray+=max(12.,(end-start)/27.0)+max(0.,-density)*149.;

  }
  return vec4(0);
}
float groundRay(vec3 d){
  float ray=2.0, prev=0.;
  if(eye.y>565. && d.y<-.002) ray=max(ray,(565.-eye.y)/d.y);
  if(eye.y>565. && d.y>=0.) return -1.;
  for(int i=0;i<124;i++){
    vec3 p=eye+d*ray;
    float h=p.y-max(0.,height(p.xz));
    if(h<.0){
      float lo=prev,hi=ray;
      for(int j=0;j<6;j++){
        float m=(lo+hi)*.5;
        vec3 q=eye+d*m;
        if(q.y>max(0.,height(q.xz))) lo=m; else hi=m;
      }
      return (lo+hi)*.5;
    }
    prev=ray;
    ray+=max(3.0+ray*.011,h*.57);

  return -1.;
}
vec3 water(vec3 p,vec3 d,float h,float t){
  float w=noise(p.xz*vec2(.075,.17)+vec2(time*.54,-time*.20));
  float ripple=noise(p.xz*vec2(.115,.33)+vec2(0,time*.64));

  c=mix(c,blue,stepped((depth-9.)/23.,4.,t));

    for(let i=0;i<=8;i++){
      const a=mix(2.34,7.09,i/8), ca=Math.cos(a),sa=Math.sin(a);
      const extent=i%2===0?4:2;
      stroke(x+ca*(r-4),y+sa*(r-4),x+ca*(r-4-extent),y+sa*(r-4-extent),i>6?copper:INK);
    }
    const a=mix(2.34,7.09,clamp((value-min)/(max-min),0,1));
    stroke(x-Math.cos(a)*3,y-Math.sin(a)*3,x+Math.cos(a)*(r-7),y+Math.sin(a)*(r-7),AMBER);
    circle(x,y,2,copper);
    ink(tag,x,y-r*.48,"#e0d4bd",1,.5);
    ink(unitLabel,x,y+r*.47,"#998c95",1,.5);
  }
  const speed=state.speed*1.94384,alt=state.p[1]*3.28084,vs=state.vs*196.85;
  const heading=Math.round(wrap(state.yaw*180/Math.PI,360))%360;
  if(portrait){tx=106;ty=72;}
  bracket(-221,29,70,61);
  ink("SYS", -211,36);
  const lamps=[["FUEL","#b2b77a"],["ARM",readyCount()?"#e7a364":"#554044"],["TERR",state.warning?"#ff714f":"#523649"],["AB",state.heat>.45?"#ffba6e":"#51404d"]];
  lamps.forEach(([tag,c],i)=>{rect(-211,47+i*8,5,4,c);ink(tag,-201,46+i*8);});
  if(portrait){tx=32;ty=0;}
  bracket(-147,20,78,73);
  ink(s<.58?"MAP":"GROUND MAP",-108,25,AMBER,1,.5);
  rect(-138,34,60,51,black);
  const sweep=state.time*2.15, radarCenter=[-108,59], rn=22;
  const cs=Math.cos(state.yaw),sn=Math.sin(state.yaw);
  const radarColors=["#513828","#956236","#c28648","#e9ac5b"];
  for(let j=-rn;j<=rn;j+=2)for(let i=-rn;i<=rn;i+=2){
    const d=Math.hypot(i,j);
    if(d>rn)continue;
    const h=terrainAt(state.p[0]+cs*i*14-sn*j*14,state.p[2]+sn*i*14+cs*j*14);
    const sweepNear=wrap(sweep-Math.atan2(j,i),TAU);
    const zone=h<0?0:h<78?1:2;
    rect(radarCenter[0]+i,radarCenter[1]+j,2,2,radarColors[zone+(sweepNear<.7?1:0)]);
    if(Math.abs(d-rn)<1||Math.abs(d-rn/2)<.8)rect(radarCenter[0]+i,radarCenter[1]+j,1,1,"#edb879");
  }
  stroke(-108,59,-108+rn*Math.cos(sweep),59+rn*Math.sin(sweep),AMBER);
  rect(-109,58,3,3,"#ffe6b0");
  if(portrait)tx=43;
  gauge(-44,39,22,"A/S",speed,80,405,"KTS");
  gauge(43,39,22,"V/S",vs,-8000,8000,"FPM");
  bracket(-25,13,50,51);
  const rx=0,ry=37,r=19, snb=Math.sin(state.bank),csb=Math.cos(state.bank);
  circle(rx,ry,r+3,"#141622");circle(rx,ry,r+2,"#84727b");
  for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++){
    if(x*x+y*y>r*r)continue;
    const h=-x*snb+y*csb-state.pitch*27;
    rect(x+rx,y+ry,1,1,Math.abs(h)<.79?"#ead6a6":h<0?(h<-9?"#476778":"#72919a"):(h>9?"#86583e":"#af764d"));
  }
  stroke(-13,37,-5,37,AMBER);stroke(5,37,13,37,AMBER);stroke(-5,37,-2,40,AMBER);stroke(5,37,2,40,AMBER);
  rect(-1,36,3,2,AMBER);
  bracket(-65,66,130,28);
  const now=new Date();
  const clock=digits(now.getHours(),2)+":"+digits(now.getMinutes(),2);
  for(const [x,tag,num] of [[-41,"ALT FT",digits(alt,4)],[0,"HDG",digits(heading)],[40,"CLK",clock]]){
    ink(tag,x,71,"#ab9ba1",1,.5);
    rect(x-17,78,35,10,black);
    ink(num,x,80,AMBER,1,.5);
  }
  if(portrait){tx=-111;ty=79;}
  bracket(69,20,83,73);
  ink("ENG 1",90,26,INK,1,.5);ink("ENG 2",130,26,INK,1,.5);
  for(const [x,i] of [[90,0],[130,1]]){
    rect(x-8,35,17,33,black);
    const rpm=state.engines[i];
    for(let i=0;i<9;i++){
      const c=i/9<rpm?(i>6?"#ed9a58":"#b6b779"):"#393644";
      rect(x-5,62-i*3,11,2,c);
    }
    ink(digits(rpm*100,2),x,73,AMBER,1,.5);
  }
  stroke(110,33,110,68,rim);
  ink("RPM",111,82,"#ab9ba1",1,.5);
  if(portrait){tx=-110;ty=73;}
  bracket(155,28,68,62);
  ink(s<.58?"THR":"THROTTLE",189,35,INK,1,.5);
  rect(175,46,8,32,black);rect(176,46,2,32,"#78636a");
  const leverY=69-state.heat*22;
  rect(167,leverY+2,26,8,black);rect(168,leverY,24,6,"#877079");rect(169,leverY,23,2,"#c2a394");
  rect(171,leverY+2,2,3,"#53414b");rect(175,leverY+2,2,3,"#53414b");
  ink("AB",202,46,copper);ink("MIL",201,72,"#ae9b9c");
  if(portrait){tx=43;ty=0;}
  const slip=state.slip*64,turn=state.turnRate*7.9;
  stroke(-71,4,-51,4,"#ab8b80");stroke(-61,1,-61,7,INK);rect(-62+slip,3,3,3,AMBER);
  stroke(51,5,71,5,"#ab8b80");stroke(61,1,61,7,INK);rect(60+turn,3,3,3,AMBER);
  ink("SLIP",-60,9,"#b7a6a8",1,.5);ink("TURN",61,9,"#b7a6a8",1,.5);
}
function readyCount(){return racks.filter(r=>state.time>=r.ready).length;}
function renderPanel(){
  ctx.clearRect(0,0,W,H);
  const cockpit=state.weights[2];
  if(cockpit>.05){
    ctx.save();ctx.globalAlpha=smooth(.19,.76,cockpit);
    const layout=dashboardLayout();
    const panelTop=H-(layout.bottom+(layout.portrait?14:21))*layout.s;
    const gH=Math.min(H*.706,panelTop),cx=W/2,span=Math.min(122,W*.39);
    const col="#6c7765";
    line(cx-span*.72,H*.068,cx+span*.72,H*.068,col);
    line(cx-span*.72,H*.068,cx-span,gH,col);
    line(cx+span*.72,H*.068,cx+span,gH,col);
    line(cx-span,gH,cx+span,gH,col);
    hud(panelTop);dashboard(layout);ctx.restore();
  } else if(state.weights[0]>.85){
    const cx=W-22,cy=22;
    bitmap("N",cx,cy-12,"#f6d4a7",1,.5);
    line(cx,cy-4,cx,cy+6,"#f6d4a7");
    line(cx,cy-4,cx-3,cy+1,"#f6d4a7");line(cx,cy-4,cx+3,cy+1,"#f6d4a7");
    line(cx-8,cy+6,cx+8,cy+6,"#d7ac92");
  }
}
function paint(){
  camera=getCamera();
  renderWorld();renderPanel();
  const ct=readyCount();
  if(lastCount!==ct){
    lastCount=ct;
    $("#count").textContent=ct+"/4";
    document.querySelectorAll(".pips i").forEach((v,i)=>v.classList.toggle("ready",state.time>=racks[i].ready));
  }
}
const FIXED=1/60;
let accumulator=0;
function draw(ts){
  const elapsed=last?Math.min(.19,(ts-last)/1000):FIXED;
  last=ts;accumulator+=elapsed;
  while(accumulator>=FIXED){simulate(FIXED);accumulator-=FIXED;}
  if(elapsed>0)fps=mix(fps,Math.min(240,1/elapsed),.065);
  if(frame>65){
    slow=fps<44?slow+elapsed:Math.max(0,slow-elapsed*1.5);
    fast=fps>57?fast+elapsed:0;
    if(slow>1.25&&quality>204){
      quality=Math.max(204,quality-34);slow=0;fast=0;updateSize();
    }else if(fast>17&&quality<340){
      quality=Math.min(340,quality+17);fast=0;slow=0;updateSize();
    }
  }
  paint();frame++;raf=requestAnimationFrame(draw);
}
function pointer(e){
  const r=deck.getBoundingClientRect();
  input.x=clamp((e.clientX-r.left-r.width*.5)/(r.width*.49),-1,1);
  input.y=clamp((e.clientY-r.top-r.height*.5)/(r.height*.47),-1,1);
}
function setupInput(){
  deck.addEventListener("pointermove",e=>{
    if(e.target.closest("button") || (e.pointerType==="touch"&&input.touch!==e.pointerId))return;
    pointer(e);state.pilot=true;start();
  });
  deck.addEventListener("pointerdown",e=>{
    if(e.target.closest("button"))return;
    start();
    if(e.pointerType==="touch"){
      e.preventDefault();
      if(input.touch!==null)return;
      input.touch=e.pointerId;deck.setPointerCapture(e.pointerId);pointer(e);state.pilot=true;
    }
  });
  // Mouse events also report a second button pressed while the first is held.
  deck.addEventListener("mousedown",e=>{
    if(e.target.closest("button"))return;
    if(e.button===0){input.left=true;input.pressed=state.time;}
    if(e.button===2)fire();
  });
  window.addEventListener("mouseup",e=>{
    if(e.button!==0)return;
    if(input.left&&state.time-input.pressed<HOLD)beginRoll();
    input.left=false;
  });
  function touchEnd(e){
    if(e.pointerId===input.touch){input.touch=null;if(state.view!==0)input.x=input.y=0;}
  }
  window.addEventListener("pointerup",touchEnd);
  window.addEventListener("pointercancel",touchEnd);
  window.addEventListener("blur",()=>{input.left=input.boost=false;input.touch=null;});
  deck.addEventListener("contextmenu",e=>e.preventDefault());
  window.addEventListener("keydown",e=>{
    if(e.repeat||e.altKey||e.ctrlKey||e.metaKey)return;
    if(e.code==="Space"&&!e.target.closest("button")){
      e.preventDefault();start();selectView((state.view+1)%3);
    }
    if(e.code==="KeyF"){e.preventDefault();start();fire();}
  });
  document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>{
    start();selectView(+b.dataset.view);b.blur();
  }));
  $(".launch").addEventListener("click",start);
  $("#roll").addEventListener("pointerdown",e=>{e.preventDefault();start();beginRoll();});
  $("#fire").addEventListener("pointerdown",e=>{e.preventDefault();start();fire();});
  $("#boost").addEventListener("pointerdown",e=>{
    e.preventDefault();e.target.setPointerCapture(e.pointerId);start();input.boost=true;
  });
  for(const event of ["pointerup","pointercancel","lostpointercapture"])$("#boost").addEventListener(event,()=>{input.boost=false;});
  $(".audio").addEventListener("click",async()=>{
    audio??=enableSound();
    await audio.ac.resume();
    audio.on=!audio.on;
    const t=audio.ac.currentTime;
    audio.out.gain.setTargetAtTime(audio.on?.74:0,t,.08);
    $(".audio").setAttribute("aria-pressed",String(audio.on));
    $(".audio span").textContent=audio.on?"SOUND ON":"SOUND OFF";
    $(".audio path").setAttribute("d",audio.on?"M1 5h3l4-3v10L4 9H1zM10 5q2 2 0 4m2-6q3 4 0 8":"M1 5h3l4-3v10L4 9H1zM10 5l3 4m0-4-3 4");
    $(".audio").blur();
  });
}
function fatal(error){
  cancelAnimationFrame(raf);
  const load=$(".loading");
  load.hidden=false;
  load.querySelector("span").textContent="PATROL NEEDS WEBGL 2";
  load.querySelector("progress").hidden=true;
  console.error(error);
}
async function boot(){
  if(!gl)throw new Error("WebGL 2 is unavailable.");
  field=await terrain();
  state.p[1]=Math.max(state.p[1],surface(state.p[0],state.p[2])+35);
  glState=setupGL();updateSize();setupInput();
  new ResizeObserver(updateSize).observe(deck);
  world.addEventListener("webglcontextlost",e=>{
    e.preventDefault();cancelAnimationFrame(raf);$(".loading").hidden=false;
    $(".loading span").textContent="RESTORING FLIGHT";$("progress").hidden=true;
  });
  world.addEventListener("webglcontextrestored",()=>{
    glState=setupGL();updateSize();last=0;$(".loading").hidden=true;raf=requestAnimationFrame(draw);
  });
  $(".loading").hidden=true;
  $(".intro").hidden=false;
  raf=requestAnimationFrame(draw);
}
boot().catch(fatal);
</script>
